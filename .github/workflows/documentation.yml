name: Documentation Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'stm32/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installing
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: CSS 
        run: |
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git doxygen-awesome-css

      - name: Doxyfile
        run: |
          doxygen -g Doxyfile

          cat << 'EOF' > custom.css
          html {
              --content-maxwidth: 1350px;
              --code-font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
              --code-font-size: 13px;

              --alert-note-color: #2b7fff;
              --alert-warning-color: #f59f00;
          }

          table.params .paramname {
              font-weight: 600;
              color: var(--primary-color);
          }
          EOF
          
          cat << 'EOF' >> Doxyfile
          PROJECT_NAME           = "${{ github.event.repository.name }}"
          OUTPUT_DIRECTORY       = docs
          INPUT                  = stm32
          RECURSIVE              = YES
          FILE_PATTERNS          = *.c *.cpp *.h *.hpp *.py *.java
          EXTRACT_ALL            = YES
          GENERATE_HTML          = YES
          GENERATE_LATEX         = NO
          HAVE_DOT               = YES
          CALL_GRAPH             = YES
          CALLER_GRAPH           = YES
          MAX_DOT_GRAPH_DEPTH    = 2
          DOT_GRAPH_MAX_NODES    = 25
          DOT_IMAGE_FORMAT       = svg
          INTERACTIVE_SVG        = YES
          DOT_TRANSPARENT        = YES
          HIDE_UNDOC_RELATIONS   = YES
          INCLUDED_BY_GRAPH      = NO
          INCLUDE_GRAPH          = YES
          DOT_MULTI_TARGETS      = YES

          GENERATE_TREEVIEW      = YES
          DISABLE_INDEX          = NO
          FULL_SIDEBAR           = NO
          HTML_COLORSTYLE        = LIGHT
          HTML_EXTRA_STYLESHEET  = doxygen-awesome-css/doxygen-awesome.css \
                                   doxygen-awesome-css/doxygen-awesome-sidebar-only.css \
                                   doxygen-awesome-css/doxygen-awesome-sidebar-only-darkmode-toggle.css \
                                   custom.css

          HTML_EXTRA_FILES       = doxygen-awesome-css/doxygen-awesome-darkmode-toggle.js \
                                   doxygen-awesome-css/doxygen-awesome-fragment-copy-button.js \
                                   doxygen-awesome-css/doxygen-awesome-interactive-toc.js \
                                   doxygen-awesome-css/doxygen-awesome-tabs.js
          USE_MATHJAX            = YES
          MATHJAX_VERSION        = MathJax_3
          MATHJAX_FORMAT         = chtml
          MATHJAX_RELPATH        = https://cdn.jsdelivr.net/npm/mathjax@3
          EOF
          
      - name: Generating Script
        run: |
          doxygen -w html header.html footer.html stylesheet.css Doxyfile

          # Chèn các script khởi chạy vào thẻ <head> của header.html
          sed -i '/<\/head>/i \
          <script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script>\
          <script type="text/javascript" src="$relpath^doxygen-awesome-fragment-copy-button.js"></script>\
          <script type="text/javascript" src="$relpath^doxygen-awesome-interactive-toc.js"></script>\
          <script type="text/javascript" src="$relpath^doxygen-awesome-tabs.js"></script>\
          <script type="text/javascript">\
              DoxygenAwesomeDarkModeToggle.init();\
              DoxygenAwesomeFragmentCopyButton.init();\
              DoxygenAwesomeInteractiveToc.init();\
              DoxygenAwesomeTabs.init();\
          </script>' header.html

          echo "HTML_HEADER = header.html" >> Doxyfile

      - name: Styling
        run: |
          doxygen -w html header.html footer.html stylesheet.css Doxyfile
          sed -i '/<\/head>/i <script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script><script type="text/javascript">DoxygenAwesomeDarkModeToggle.init()</script>' header.html
          echo "HTML_HEADER = header.html" >> Doxyfile

      - name: Compiling
        run: doxygen Doxyfile

      - name: Load
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
